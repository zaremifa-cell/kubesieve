# A deliberately insecure application, used in the README and the integration tests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api}
    spec:
      containers:
        - name: api
          image: acme/payments-api:latest
          env:
            - name: DB_PASSWORD
              value: "s3cr3t-passw0rd"
            - name: STRIPE_API_KEY
              value: "sk_live_not_a_real_key"
          securityContext:
            privileged: true
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: shop
spec:
  type: LoadBalancer
  selector: {app: payments-api}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments
  namespace: shop
spec:
  rules:
    - host: pay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: payments-api, port: {number: 80}}
