apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-shipper
  namespace: kube-system
spec:
  selector:
    matchLabels: {app: log-shipper}
  template:
    metadata:
      labels: {app: log-shipper}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: shipper
          image: fluent/fluent-bit
          securityContext:
            runAsUser: 0
            capabilities:
              add: [SYS_ADMIN, NET_BIND_SERVICE]
          volumeMounts:
            - {name: docker-sock, mountPath: /var/run/docker.sock}
            - {name: varlog, mountPath: /var/log}
      volumes:
        - name: docker-sock
          hostPath: {path: /var/run/docker.sock}
        - name: varlog
          hostPath: {path: /var/log}
